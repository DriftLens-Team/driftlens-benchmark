name: DriftLens benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -q -m "not companion"
      - run: uv run --no-sync ruff check src tests examples
      - run: uv run --no-sync python -m build --wheel
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv pip install "driftlens-sql-agent @ git+https://github.com/DriftLens-Team/driftlens-sql-agent.git@b67ec9cd8c62763ec68ca896aafeef674081c558"
      - run: uv run --no-sync pytest -q -m companion
  semalign-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv pip install "driftlens-sql-agent @ git+https://github.com/DriftLens-Team/driftlens-sql-agent.git@001b65b34f4475c6d90059539020d884be2b099f"
      - run: uv run --no-sync pytest -q -m semalign_companion
        env:
          DRIFTLENS_SEMALIGN_AGENT_PYTHON: ${{ github.workspace }}/.venv/bin/python
